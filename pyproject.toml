[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-high-scanner"
version = "0.1.0"
description = "Research-only 'New Local High' breakout scanner for KuCoin USDT spot markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
local-high-scanner = "local_high.main:main"
local-high-web = "local_high.webapp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_high"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
